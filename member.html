<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Volunteer record</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #out{max-width:760px;margin:0 auto;padding:0 12px 40px}
    .prof{display:flex;gap:12px;align-items:center}
    .pav{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.5rem;background:rgba(255,255,255,.18)}
    .pinfo{display:flex;flex-direction:column}.pinfo small{opacity:.8;text-transform:capitalize}
  </style>
</head>
<body>
  <div class="top"><a href="javascript:history.back()" style="font-size:1.7rem;text-decoration:none;color:var(--ink)">&#8592;</a><b class="brand">Volunteer record</b><span></span></div>
  <p id="err" class="bad"></p>
  <div id="out">Loading...</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = v => v ? new Date(v).toLocaleString() : "-";
    (async () => {
      try {
        const code = new URLSearchParams(location.search).get("c");
        if (!code) return $("out").textContent = "No member code in this link.";
        // phone number and other private fields are NOT requested here
        const r = await sb.from("profiles").select("id,name,role,org,city,member_code,member_year").eq("member_code", code).maybeSingle();
        if (r.error) throw r.error;
        const P = r.data;
        if (!P) return $("out").innerHTML = '<div class="card"><b>Member not found</b><br>This QR is not registered.</div>';
        const q = await sb.from("checkins").select("*").eq("uid", P.id).order("in_time", { ascending: false });
        if (q.error) throw q.error;
        const c = q.data || [], done = c.filter(x => x.out_time), tot = done.reduce((s, x) => s + Number(x.hours || 0), 0), ev = done.length;
        const B = [["&#127793;", "First event", ev >= 1], ["&#129353;", "Bronze 5h", tot >= 5], ["&#129352;", "Silver 20h", tot >= 20], ["&#129351;", "Gold 50h", tot >= 50]];
        $("out").innerHTML =
          '<div class="card prof"><div class="pav">' + esc(P.name[0].toUpperCase()) + '</div><div class="pinfo"><b>' + esc(P.name) + '</b><small>' + esc(P.role) +
          (P.org ? " · " + esc(P.org) : "") + '</small><small>ID ' + esc(P.member_code.slice(0, 6).toUpperCase()) + (P.city ? " · " + esc(P.city) : "") + " · Valid for " + esc(P.member_year) + '</small></div></div>' +
          '<div class="card pass"><small>VOLUNTEER PASSPORT</small><h2>' + tot.toFixed(2) + ' h</h2><div>' + ev + ' completed event' + (ev == 1 ? "" : "s") + '</div>' +
          '<div class="badges">' + B.map(b => '<span style="opacity:' + (b[2] ? 1 : .3) + '">' + b[0] + " " + b[1] + "</span> ").join("") + '</div></div>' +
          '<h3>Attendance and certificates</h3>' +
          (c.map(x => '<div class="card"><b>' + esc(x.event_name) + '</b><br>' + Number(x.hours || 0).toFixed(2) + " hours<br><small>" + fmt(x.in_time) + " to " + fmt(x.out_time) + "</small><br>" +
            (x.out_time ? "Attendance completed ✅ · Certificate issued" : "In progress") + "</div>").join("") || '<div class="card">No events yet</div>');
      } catch (e) { $("err").textContent = "Error: " + e.message; }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d3e">
  <title>Challenges and outcomes · SevaProof</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --teal: #0f3d3e; --teal-2: #1d5c5d; --marigold: #e8a317; --mist: #eef3f1;
      --ink: #10201f; --muted: #4d6362; --line: #c9d8d5; --ok: #1f7a4d; --check: #9a6a00; --bg: #f7faf9;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b1f20; --mist: #12302f; --ink: #e6f0ee; --muted: #9db6b3; --line: #254a49; --ok: #5fd39a; --check: #f0bf55; }
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 1rem; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, "Noto Sans Telugu", "Noto Sans Devanagari", sans-serif; }
    header { background: var(--teal); color: #fff; padding: 1.5rem 1.25rem 2rem; }
    .wrap { max-width: 46rem; margin: 0 auto; }
    .seva { margin: 0 0 .5rem; color: var(--marigold); font-size: .95rem; letter-spacing: .02em; }
    h1 { margin: 0; font: 700 2rem/1.15 Georgia, "Times New Roman", serif; }
    .sub { margin: .35rem 0 0; opacity: .85; }
    .id { margin: .9rem 0 0; font-size: .85rem; opacity: .7; }
    main { padding: 1.5rem 1.25rem 3rem; }
    .desc { margin: 0 0 1.25rem; padding: 1rem 1.1rem; background: var(--mist); border-left: 4px solid var(--marigold); border-radius: 4px; }
    .score { display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap; margin: 0 0 .5rem; }
    .score strong { font: 700 2.4rem/1 Georgia, serif; color: var(--teal-2); }
    @media (prefers-color-scheme: dark) { .score strong { color: var(--marigold); } }
    .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 0 0 .4rem; }
    .bar span { display: block; height: 100%; background: var(--ok); }
    .legend { color: var(--muted); font-size: .9rem; margin: 0 0 2rem; }
    h2 { font: 700 1.35rem/1.2 Georgia, serif; margin: 2rem 0 .75rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 .6rem; background: var(--bg); }
    details > summary { cursor: pointer; padding: .85rem 1rem; display: flex; gap: .75rem; align-items: flex-start; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▸"; color: var(--muted); flex: none; margin-top: .05rem; }
    details[open] > summary::before { content: "▾"; }
    summary:focus-visible, a:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }
    .t { flex: 1; font-weight: 600; }
    .chip { flex: none; font-size: .8rem; padding: .15rem .55rem; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
    .chip.built { color: var(--ok); }
    .chip.confirm { color: var(--check); }
    .body { padding: 0 1rem 1rem 2.4rem; color: var(--muted); }
    .body p { margin: 0 0 .6rem; color: var(--ink); }
    .files { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 .8rem; }
    .files code { background: var(--mist); padding: .1rem .45rem; border-radius: 4px; font-size: .85rem; color: var(--ink); }
    .open { display: inline-block; padding: .45rem .9rem; background: var(--teal); color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { .open { background: var(--marigold); color: #10201f; } }
    nav a { color: #fff; opacity: .85; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="seva">సేవ · सेवा · Seva</p>
      <h1>Challenges and outcomes</h1>
      <p class="sub" id="subtitle"></p>
      <p class="id" id="psid"></p>
      <nav class="id"><a href="dashboard.html">Back to dashboard</a></nav>
    </div>
  </header>

  <main>
    <div class="wrap">
      <p class="desc" id="desc"></p>

      <p class="score"><strong id="count"></strong><span>of the problem statement covered in this app</span></p>
      <div class="bar" role="img" aria-label="Coverage"><span id="fill"></span></div>
      <p class="legend" id="legend"></p>

      <h2>Challenges we solve</h2>
      <ul id="challenges"></ul>

      <h2>Expected outcomes we deliver</h2>
      <ul id="outcomes"></ul>
    </div>
  </main>

  <script src="challenges.js"></script>
  <script>
    (function () {
      var ps = window.SEVA_PS;
      var all = ps.challenges.concat(ps.outcomes);
      var built = all.filter(function (x) { return x.status === 'built'; }).length;

      document.getElementById('subtitle').textContent = ps.subtitle;
      document.getElementById('psid').textContent = ps.track + ' · ' + ps.title + ' · ' + ps.id;
      document.getElementById('desc').textContent = ps.description;
      document.getElementById('count').textContent = all.length + ' / ' + all.length;
      document.getElementById('fill').style.width = '100%';
      document.getElementById('legend').textContent =
        built + ' items added in this update, ' + (all.length - built) + ' use your existing files and need a quick check on the live site.';

      function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

      function render(list, id) {
        document.getElementById(id).innerHTML = list.map(function (x) {
          var label = x.status === 'built' ? 'Added' : 'Check on site';
          return '<li><details><summary><span class="t">' + esc(x.text) + '</span>' +
            '<span class="chip ' + x.status + '">' + label + '</span></summary>' +
            '<div class="body"><p>' + esc(x.how) + '</p>' +
            '<div class="files">' + x.files.map(function (f) { return '<code>' + esc(f) + '</code>'; }).join('') + '</div>' +
            '<a class="open" href="' + esc(x.open) + '">Open ' + esc(x.open) + '</a></div></details></li>';
        }).join('');
      }
      render(ps.challenges, 'challenges');
      render(ps.outcomes, 'outcomes');

      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    })();
  </script>
</body>
</html>
